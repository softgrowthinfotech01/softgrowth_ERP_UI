trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  persistCredentials: true
  fetchDepth: 0

- script: |
    git config user.email "azure-pipeline@softgrowthinfotech.com"
    git config user.name "Azure Pipeline"

    echo "Adding Azure Repos destination with PAT..."
    git remote add azure "https://pat:$(AZURE_PAT)@dev.azure.com/softgrowthinfotech19/Softgrowth_ERP/_git/Softgrowth_ERP"

    echo "Fetching Azure branches..."
    git fetch azure

    echo "Checking out GitHub main as test branch..."
    git checkout -B github-sync-test

    echo "Pushing GitHub code to Azure test branch..."
    git push azure github-sync-test:github-sync-test
  displayName: "Sync GitHub main to Azure test branch"
  env:
    AZURE_PAT: $(AZURE_PAT)